<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> Moeda Estrangeira</title>

</head>
<body>
  <div class="container">
    <h1>Investimento em Moeda Estrangeira</h1>

    <label for="valorInvestido">Valor investido (moeda estrangeira):</label>
    <input type="number" id="valorInvestido" placeholder="Ex: 100" step="0.01" min="0" />

    <label for="taxaAtual">Taxa de câmbio atual (R$):</label>
    <input type="number" id="taxaAtual" placeholder="Ex: 5.30" step="0.0001" min="0" />

    <label for="taxaCompra">Taxa de câmbio no momento da compra (opcional):</label>
    <input type="number" id="taxaCompra" placeholder="Ex: 4.80" step="0.0001" min="0" />

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>
  </div>

  <script src="js.js">
  </script>
</body>
</html>
