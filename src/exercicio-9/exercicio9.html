<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Gorjeta</title>
</head>
<body>

  <div class="container">
    <h1> Gorjeta</h1>

    <label>Valor da conta:</label>
    <input type="number" id="valor" placeholder="Ex: 100">

    <label>Percentual de gorjeta (%):</label>
    <input type="number" id="percentual" placeholder="Ex: 10">

    <label>Número de pessoas (opcional):</label>
    <input type="number" id="pessoas" placeholder="Ex: 3">

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
