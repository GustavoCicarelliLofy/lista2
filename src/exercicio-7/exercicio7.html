<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Bitcoin</title>
</head>
<body>

  <div class="container">
    <h1>Calculadora de Investimento em Bitcoin</h1>

    <label>Quantidade de Bitcoin:</label>
    <input type="number" id="qtd" step="0.0001">

    <label>Preço atual (R$):</label>
    <input type="number" id="preco">

    <label>Valor investido (opcional):</label>
    <input type="number" id="investido">

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
